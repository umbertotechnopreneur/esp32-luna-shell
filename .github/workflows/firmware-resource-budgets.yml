name: Firmware resource budgets

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-resource-budgets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resource-budgets:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      LUNASHELL_CI_BUILD_DIR: artifacts/build-ci-resource-budgets
      LUNASHELL_CI_IDF_PATH: ${{ github.workspace }}/.ci/esp-idf
      LUNASHELL_CI_TOOLS_PATH: ${{ runner.temp }}/esp-idf-tools

    steps:
      - name: Check out firmware and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Select deterministic host Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"

      - name: Run resource-budget self-tests
        shell: pwsh -NoProfile -File {0}
        run: python scripts/test_resource_budgets.py

      - name: Check out ESP-IDF 6.0.2
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: v6.0.2
          path: .ci/esp-idf
          fetch-depth: 1
          submodules: recursive

      - name: Restore ESP-IDF tools
        uses: actions/cache@v4
        with:
          path: ${{ env.LUNASHELL_CI_TOOLS_PATH }}
          key: esp-idf-tools-${{ runner.os }}-v6.0.2-esp32s3-python313-v1

      - name: Restore managed components
        uses: actions/cache@v4
        with:
          path: managed_components
          key: >-
            managed-components-${{ runner.os }}-${{ hashFiles('config/dependency-locks/**/*.lock', '**/idf_component.yml') }}

      - name: Install and export ESP-IDF tools
        shell: pwsh -NoProfile -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          $env:IDF_TOOLS_PATH = $env:LUNASHELL_CI_TOOLS_PATH
          $install = Join-Path $env:LUNASHELL_CI_IDF_PATH "install.ps1"
          & $install esp32s3
          if ($LASTEXITCODE -ne 0) {
              throw "ESP-IDF tool installation failed with exit code $LASTEXITCODE"
          }
          . (Join-Path $env:LUNASHELL_CI_IDF_PATH "export.ps1")
          $pythonExe = Join-Path $env:IDF_PYTHON_ENV_PATH "Scripts/python.exe"
          if (-not (Test-Path -LiteralPath $pythonExe -PathType Leaf)) {
              throw "ESP-IDF Python environment not found: $pythonExe"
          }
          "LUNASHELL_CI_PYTHON=$pythonExe" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, size, and enforce budgets
        shell: pwsh -NoProfile -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-DeviceAction(
              [string]$Action,
              [string[]]$ActionArguments = @()
          ) {
              & pwsh -NoProfile -File "scripts/device.ps1" $Action `
                  -BuildDir $env:LUNASHELL_CI_BUILD_DIR `
                  -Profile full `
                  -Jobs 8 `
                  -IdfPath $env:LUNASHELL_CI_IDF_PATH `
                  -ToolsPath $env:LUNASHELL_CI_TOOLS_PATH `
                  -PythonExe $env:LUNASHELL_CI_PYTHON `
                  @ActionArguments
              if ($LASTEXITCODE -ne 0) {
                  throw "Device build action '$Action' failed with exit code $LASTEXITCODE"
              }
          }

          Invoke-DeviceAction set-target
          Invoke-DeviceAction build

          $buildDir = Join-Path $PWD $env:LUNASHELL_CI_BUILD_DIR
          $sizeReport = Join-Path $buildDir "esp-idf-size.json"
          $budgetReport = Join-Path $buildDir "resource-budget-report.json"
          Invoke-DeviceAction size @(
              "-SizeOutputFormat", "json2",
              "-SizeOutputFile", $sizeReport
          )

          & $env:LUNASHELL_CI_PYTHON "scripts/check_resource_budgets.py" `
              --build-dir $buildDir `
              --size-report $sizeReport `
              --config "scripts/resource_budgets.json" `
              --json-report $budgetReport `
              --github-summary $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) {
              throw "Resource-budget check failed with exit code $LASTEXITCODE"
          }

      - name: Upload resource reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-resource-budget-report
          if-no-files-found: warn
          path: |
            artifacts/build-ci-resource-budgets/esp-idf-size.json
            artifacts/build-ci-resource-budgets/resource-budget-report.json
