# Waveshare board build: display/touch shell plus optional headless services.
# Change an optional mode from "off" to "service" to compile that device path.
schema_version: 2
name: ui-bootstrap
board: waveshare-esp32s3-touch-amoled-1.75
variant: ui-minimal
modules:
  display: {driver: co5300, mode: ui}
  touch: {driver: cst9217, mode: service}
  i2c: {driver: esp-idf-master, mode: service}
  internal_storage: {driver: littlefs-nvs, mode: service}
  pmu: {driver: axp2101, mode: "off"}
  battery: {driver: axp2101-battery, mode: "off"}
  rtc: {driver: pcf85063, mode: "off"}
  imu: {driver: qmi8658, mode: "off"}
  gnss: {driver: lc76g, mode: "off"}
  audio_output: {driver: es8311, mode: "off"}
  microphones: {driver: es7210-dual, mode: "off"}
  # Set service to admit FatFS, SDMMC protocol and the SDMMC host driver together.
  sd: {driver: sdmmc, mode: "off"}
  wifi: {driver: esp32s3, mode: "off"}
  bluetooth: {driver: esp32s3-ble, mode: "off"}
  distance: {driver: tof400f-dual-uart, mode: "off"}
ui:
  app: shell
  screens: []
