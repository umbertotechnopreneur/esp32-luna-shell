# Offline movement companion: radios, GNSS and microphone disabled.
# Brookesia still needs lwIP IPv6 socket types at compile time.
schema_version: 2
name: leg-edition
board: waveshare-esp32s3-touch-amoled-1.75
variant: leg-edition
modules:
  display: {driver: co5300, mode: ui}
  touch: {driver: cst9217, mode: service}
  i2c: {driver: esp-idf-master, mode: service}
  internal_storage: {driver: littlefs-nvs, mode: service}
  pmu: {driver: axp2101, mode: service}
  battery: {driver: axp2101-battery, mode: service}
  rtc: {driver: pcf85063, mode: "off"}
  imu: {driver: qmi8658, mode: service}
  gnss: {driver: lc76g, mode: "off"}
  audio_output: {driver: es8311, mode: service}
  microphones: {driver: es7210-dual, mode: "off"}
  # service automatically admits FatFS, SDMMC protocol and the SDMMC host driver.
  sd: {driver: sdmmc, mode: service}
  wifi: {driver: esp32s3, mode: "off"}
  bluetooth: {driver: esp32s3-ble, mode: "off"}
  distance: {driver: tof400f-dual-uart, mode: "off"}
ui:
  app: leg-edition
  screens: [accelerometer, gyroscope, combo, movement, settings]
