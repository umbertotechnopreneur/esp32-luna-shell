# Cody identity, entities, normalized rig and indexed style.
# Point offsets are relative to their parent anchor; curve handles follow their knots.
# Paints name palette colors; use mint.level.00 through mint.level.47 for mint.
schema: cody.rig.v2
character:
  id: cody
  name: Cody
  facing: front
palette_file: assets/cody/palette/palette256.json
# Style references stable palette color IDs; widths/diameters below are pixels.
style:
  paints:
    cloud:
    - blue.level.00
    - blue.level.63
    cheek:
    - coral.level.11
    - coral.level.11
    ink:
    - fixed.ink
    - fixed.ink
    highlight:
    - fixed.highlight
    - fixed.highlight
  debug:
    anchor: fixed.highlight
    knot: blue.level.00
    handle: gold.level.04
    link: blue.level.63
    selected: mint.level.26
  back:
    fill:
    - blue.level.00
    - blue.level.63
    ink: fixed.ink
    stroke: 3
  host_font:
    family: JetBrains Mono Nerd Font
    size: 10
  background: fixed.background
  debug_metrics:
    link_width: 1
    handle_width: 1
    outline_width: 1
    anchor_diameter: 5
    handle_diameter: 3
    selected_diameter: 9
    label_marker_diameter: 6
  overlay_toggle:
    stroke: 1
    marker_diameter: 5
entities:
  body:
    label: Body
    anchor: center
    paths:
    - body
  cheek.left:
    label: Cheek Left
    anchor: cheek.left
    paths:
    - cheek.left
  cheek.right:
    label: Cheek Right
    anchor: cheek.right
    paths:
    - cheek.right
  eye.left:
    label: Eye Left
    anchor: eye.left
    paths:
    - eye.left
  eye.left.shine:
    label: Eye Left Shine
    anchor: eye.left.shine
    paths:
    - eye.left.shine
  brow.left:
    label: Brow Left
    anchor: brow.left
    paths:
    - brow.left
  eye.right:
    label: Eye Right
    anchor: eye.right
    paths:
    - eye.right
  eye.right.shine:
    label: Eye Right Shine
    anchor: eye.right.shine
    paths:
    - eye.right.shine
  brow.right:
    label: Brow Right
    anchor: brow.right
    paths:
    - brow.right
  nose:
    label: Nose
    anchor: nose
    paths:
    - nose
  mouth:
    label: Mouth
    anchor: mouth
    paths:
    - mouth
coordinate_system: parent-relative normalized offsets; centered root, x right, y down; names use viewer left/right
subdivisions: 12
channels:
- name: eye_left
  minimum: 0
  maximum: 1
  default: 1
- name: eye_right
  minimum: 0
  maximum: 1
  default: 1
- name: brow_left
  minimum: -1
  maximum: 1
  default: 0
- name: brow_right
  minimum: -1
  maximum: 1
  default: 0
- name: mouth_open
  minimum: 0
  maximum: 1
  default: 0.15
- name: breath
  minimum: -1
  maximum: 1
  default: 0
- name: mouth_width
  minimum: 0.5
  maximum: 1.6
  default: 1
- name: nose_size
  minimum: 0.5
  maximum: 1.6
  default: 1
- name: cheek_size
  minimum: 0.4
  maximum: 1.8
  default: 1.2
- name: cheek_opacity
  minimum: 0
  maximum: 1
  default: 1
# Shape and opacity controls compose with the original six facial channels.
# Scale only descendants; the named anchor remains fixed in the face.
face_transition_seconds: 0.18
# External stimuli feed continuous artistic state, never a measured emotion.
# Board axes are explicit; verify their signs during the first hardware session.
response:
  schema: cody.response.v2
  audio:
    sample_timeout_seconds: 2.5
    microphone_reference: 0.08
    playback_reference: 0.18
    attack_seconds: 0.08
    release_seconds: 0.3
    attention_brow: 0.3
    playback_mouth: 0.65
  idle:
    after_seconds: 20
    duration_seconds: 3.2
    cooldown_seconds: 40
    activity_stress_threshold: 0.15
    audio_activity_threshold: 0.08
    mouth_open: 0.85
    eye_closure: 0.75
  motion:
    source: motion.acceleration
    unit: m/s2
    board_to_panel:
      x: {axis: x, sign: 1}
      y: {axis: y, sign: 1}
      z: {axis: z, sign: 1}
    sensitivity: 1
    baseline_seconds: 0.7
    sample_timeout_seconds: 0.75
    # Translation is a fraction of the resting body scale; Z changes scale only.
    translation_gain: 0.028
    translation_limit: 0.14
    depth_gain: 0.005
    depth_limit: 0.05
    spring_hz: 2.8
    damping_ratio: 0.78
    stress_reference_mps2: 5
  power:
    source: power.charge
    unit: percent
    sample_timeout_seconds: 8
    fatigue_curve: 1.6
  state:
    stress_attack_seconds: 0.18
    stress_release_seconds: 2.8
    fatigue_attack_seconds: 1.6
    fatigue_release_seconds: 3
  expression:
    stress_brow: 0.75
    fatigue_eye_closure: 0.65
    fatigue_cheek_fade: 0.35
    stress_mouth_open: 0.2
    stress_mouth_narrowing: 0.15
    stress_wave_gain: 0.5
    stress_wave_speed_gain: 0.4
    fatigue_wave_slowdown: 0.6
    fatigue_fullness: 0.1
    base_breath_hz: 0.25
    stress_breath_gain: 0.8
    fatigue_breath_slowdown: 0.55
    rhythm_blend_seconds: 0.22
face_transforms:
- {anchor: mouth, channel: mouth_width, axes: [x]}
- {anchor: nose, channel: nose_size, axes: [x, y]}
- {anchor: cheek.left, channel: cheek_size, axes: [x, y]}
- {anchor: cheek.right, channel: cheek_size, axes: [x, y]}
path_opacity:
  cheek.left: cheek_opacity
  cheek.right: cheek_opacity
expression_presets:
  embarrassed:
    eye_left: 0.65
    eye_right: 0.65
    brow_left: 0.3
    brow_right: 0.3
    mouth_open: 0.12
    breath: 0
    mouth_width: 0.8
    nose_size: 1
    cheek_size: 1.5
    cheek_opacity: 0.85
# Shape controls affect only the outline anchors and their child handles.
# Speed is cycles/second; phase is integrated, never recomputed from elapsed * speed.
contour:
  path: body
  transition_seconds: 0.35
  controls:
  - {name: fullness, label: Fullness, minimum: -1, maximum: 1, default: 0}
  - {name: amplitude, label: Wave amplitude, minimum: 0, maximum: 1, default: 0.35}
  - {name: speed, label: Wave speed (cycles/s), minimum: 0, maximum: 2, default: 0.2}
  - {name: phase_spread, label: Phase spread, minimum: 0, maximum: 1, default: 1}
  # Unit directions follow the authored perimeter. Small feet get smaller excursions.
  # Fullness and wave are maximum normalized distances, not sensor measurements.
  lobes:
  - {point: lobe.left, direction: [-1, 0], fullness: 0.025, wave: 0.025, limit: 0.12, phase_turns: 0.0}
  - {point: lobe.upper_left, direction: [-0.6, -0.8], fullness: 0.035, wave: 0.045, limit: 0.12, phase_turns: 0.091}
  - {point: lobe.crown, direction: [0, -1], fullness: 0.05, wave: 0.06, limit: 0.12, phase_turns: 0.182}
  - {point: lobe.upper_right, direction: [0.6, -0.8], fullness: 0.035, wave: 0.04, limit: 0.12, phase_turns: 0.273}
  - {point: lobe.shoulder, direction: [0.8, -0.6], fullness: 0.035, wave: 0.035, limit: 0.12, phase_turns: 0.364}
  - {point: lobe.right, direction: [1, 0], fullness: 0.025, wave: 0.025, limit: 0.12, phase_turns: 0.455}
  - {point: lobe.lower_right, direction: [0.6, 0.8], fullness: 0.02, wave: 0.02, limit: 0.12, phase_turns: 0.545}
  - {point: lobe.foot_right, direction: [0, 1], fullness: 0.014, wave: 0.014, limit: 0.03, phase_turns: 0.636}
  - {point: lobe.belly, direction: [0, 1], fullness: 0.018, wave: 0.018, limit: 0.12, phase_turns: 0.727}
  - {point: lobe.foot_left, direction: [0, 1], fullness: 0.012, wave: 0.012, limit: 0.03, phase_turns: 0.818}
  - {point: lobe.lower_left, direction: [-0.6, 0.8], fullness: 0.014, wave: 0.014, limit: 0.03, phase_turns: 0.909}
