# Cody identity, entities, normalized rig and indexed style.
# Point offsets are relative to their parent anchor; curve handles follow their knots.
# Cloud paint keeps a warm ivory crown and a cool blue-grey underside.
# Rounded lobe undersides carry cool depth beneath warm crowns; the face stays front-facing.
schema: cody.rig.v2
character:
  id: cody
  name: Cody
  facing: front
palette_file: assets/cody/palette/palette256.json
# Style references stable palette color IDs; widths/diameters below are pixels.
style:
  paints:
    cloud:
    - cloud.level.00
    - cloud.level.31
    cloud.shadow:
    - cloud.level.24
    - cloud.level.31
    cloud.fold.warm:
    - cloud.shadow.level.00
    - cloud.fold.cool.level.07
    cloud.fold.cool:
    - cloud.level.32
    - cloud.level.63
    cheek:
    - coral.level.00
    - coral.level.09
    tongue:
    - coral.level.00
    - coral.level.09
    ink:
    - fixed.ink
    - fixed.ink
    highlight:
    - fixed.highlight
    - fixed.highlight
  debug:
    anchor: fixed.highlight
    knot: blue.level.00
    handle: gold.level.04
    link: blue.level.63
    selected: mint.level.26
  back:
    fill:
    - blue.level.00
    - blue.level.63
    ink: fixed.ink
    stroke: 3
  host_font:
    family: JetBrains Mono Nerd Font
    size: 10
  background: fixed.background
  debug_metrics:
    link_width: 1
    handle_width: 1
    outline_width: 1
    anchor_diameter: 5
    handle_diameter: 3
    selected_diameter: 9
    label_marker_diameter: 6
  overlay_toggle:
    stroke: 1
    marker_diameter: 5
entities:
  body:
    label: Body
    anchor: center
    paths:
    - body
  body.shadow.lower:
    label: Lower Cloud Relief
    anchor: lobe.belly
    paths:
    - body.shadow.lower
  body.shadow.crown:
    label: Crown Cloud Volume
    anchor: lobe.crown
    paths:
    - body.shadow.crown
  body.shadow.left:
    label: Left Cloud Volume
    anchor: lobe.upper_left
    paths:
    - body.shadow.left
  body.shadow.right:
    label: Right Cloud Volume
    anchor: lobe.shoulder
    paths:
    - body.shadow.right
  cheek.left:
    label: Cheek Left
    anchor: cheek.left
    paths:
    - cheek.left
  cheek.right:
    label: Cheek Right
    anchor: cheek.right
    paths:
    - cheek.right
  eye.left:
    label: Eye Left
    anchor: eye.left
    paths:
    - eye.left
  eye.left.shine:
    label: Eye Left Shine
    anchor: eye.left.shine
    paths:
    - eye.left.shine
  brow.left:
    label: Brow Left
    anchor: brow.left
    paths:
    - brow.left
  eye.right:
    label: Eye Right
    anchor: eye.right
    paths:
    - eye.right
  eye.right.shine:
    label: Eye Right Shine
    anchor: eye.right.shine
    paths:
    - eye.right.shine
  brow.right:
    label: Brow Right
    anchor: brow.right
    paths:
    - brow.right
  nose:
    label: Nose
    anchor: nose
    paths:
    - nose
  mouth:
    label: Mouth
    anchor: mouth
    paths:
    - mouth
    - mouth.tongue
coordinate_system: parent-relative normalized offsets; centered root, x right, y down; names use viewer left/right
subdivisions: 12
channels:
- name: eye_left
  minimum: 0
  maximum: 1
  default: 1
- name: eye_right
  minimum: 0
  maximum: 1
  default: 1
- name: brow_left
  minimum: -1
  maximum: 1
  default: 0
- name: brow_right
  minimum: -1
  maximum: 1
  default: 0
- name: mouth_open
  minimum: 0
  maximum: 1
  default: 0.04
- name: breath
  minimum: -1
  maximum: 1
  default: 0
- name: mouth_width
  minimum: 0.5
  maximum: 1.6
  default: 0.72
- name: nose_size
  minimum: 0.5
  maximum: 1.6
  default: 1
- name: cheek_size
  minimum: 0.4
  maximum: 1.8
  default: 1
- name: cheek_opacity
  minimum: 0
  maximum: 1
  default: 0.58
# Shape and opacity controls compose with the original six facial channels.
# Scale only descendants; the named anchor remains fixed in the face.
face_transition_seconds: 0.18
# External stimuli feed continuous artistic state, never a measured emotion.
# Board axes are explicit; verify their signs during the first hardware session.
response:
  schema: cody.response.v3
  touch:
    event_timeout_seconds: 2
    eye_hit_radius: 0.16
    eye_hold_seconds: 0.65
    close_seconds: 0.06
    reopen_seconds: 0.35
    annoyance_release_seconds: 3
    stress_gain: 0.7
    brow_gain: 0.9
    drag_gain: 1.65
    drag_limit_px: 60
    press_depth: 0.15
    spring_hz: 3
    damping_ratio: 0.28
  audio:
    sample_timeout_seconds: 2.5
    microphone_reference: 0.08
    playback_reference: 0.18
    attack_seconds: 0.08
    release_seconds: 0.3
    attention_brow: 0.3
    playback_mouth: 0.65
  idle:
    after_seconds: 20
    duration_seconds: 3.2
    cooldown_seconds: 40
    activity_stress_threshold: 0.15
    audio_activity_threshold: 0.08
    mouth_open: 0.85
    eye_closure: 0.75
  motion:
    source: motion.acceleration
    unit: m/s2
    board_to_panel:
      # Exchange the mounting axes: the user observed screen X/Y reversed.
      x: {axis: y, sign: 1}
      y: {axis: x, sign: 1}
      z: {axis: z, sign: 1}
    # Strong blob response: retain the impulse longer and settle with visible wobble.
    # Sensitivity and translation limits stay inside the existing reviewed envelope.
    sensitivity: 4
    baseline_seconds: 1.2
    sample_timeout_seconds: 0.75
    # Translation is a fraction of the resting body scale; Z changes scale only.
    translation_gain: 0.095
    translation_limit: 0.22
    depth_gain: 0.026
    depth_limit: 0.1
    spring_hz: 1.8
    damping_ratio: 0.23
    stress_reference_mps2: 3.5
  power:
    source: power.charge
    unit: percent
    sample_timeout_seconds: 8
    fatigue_curve: 1.6
  state:
    stress_attack_seconds: 0.045
    stress_release_seconds: 1.9
    fatigue_attack_seconds: 1.6
    fatigue_release_seconds: 3
  expression:
    stress_brow: 0.75
    fatigue_eye_closure: 0.65
    fatigue_cheek_fade: 0.35
    stress_mouth_open: 0.2
    stress_mouth_narrowing: 0.15
    stress_wave_gain: 0.98
    stress_wave_speed_gain: 0.6
    fatigue_wave_slowdown: 0.6
    fatigue_fullness: 0.1
    base_breath_hz: 0.25
    stress_breath_gain: 0.8
    fatigue_breath_slowdown: 0.55
    rhythm_blend_seconds: 0.22
face_transforms:
- {anchor: mouth, channel: mouth_width, axes: [x]}
- {anchor: nose, channel: nose_size, axes: [x, y]}
- {anchor: cheek.left, channel: cheek_size, axes: [x, y]}
- {anchor: cheek.right, channel: cheek_size, axes: [x, y]}
path_opacity:
  cheek.left: cheek_opacity
  cheek.right: cheek_opacity
