# Cody identity, entities, normalized rig and indexed style.
# Point offsets are relative to their parent anchor; curve handles follow their knots.
# Paint slots refer to palette256.json; cloud [84, 131] selects mint.
schema: cody.rig.v1
character:
  id: cody
  name: Cody
  facing: front
palette_file: assets/cody/palette/palette256.json
style:
  paints:
    cloud:
    - 20
    - 83
    cheek:
    - 143
    - 143
    ink:
    - 3
    - 3
    highlight:
    - 1
    - 1
  debug:
    anchor: 1
    knot: 20
    handle: 160
    link: 83
    selected: 110
  back:
    fill:
    - 20
    - 83
    ink: 3
  host_font:
    family: JetBrains Mono Nerd Font
    size: 10
entities:
  body:
    label: Body
    anchor: center
    paths:
    - body
  cheek.left:
    label: Cheek Left
    anchor: cheek.left
    paths:
    - cheek.left
  cheek.right:
    label: Cheek Right
    anchor: cheek.right
    paths:
    - cheek.right
  eye.left:
    label: Eye Left
    anchor: eye.left
    paths:
    - eye.left
  eye.left.shine:
    label: Eye Left Shine
    anchor: eye.left.shine
    paths:
    - eye.left.shine
  brow.left:
    label: Brow Left
    anchor: brow.left
    paths:
    - brow.left
  eye.right:
    label: Eye Right
    anchor: eye.right
    paths:
    - eye.right
  eye.right.shine:
    label: Eye Right Shine
    anchor: eye.right.shine
    paths:
    - eye.right.shine
  brow.right:
    label: Brow Right
    anchor: brow.right
    paths:
    - brow.right
  nose:
    label: Nose
    anchor: nose
    paths:
    - nose
  mouth:
    label: Mouth
    anchor: mouth
    paths:
    - mouth
coordinate_system: parent-relative normalized offsets; centered root, x right, y down; names use viewer left/right
subdivisions: 12
channels:
- name: eye_left
  minimum: 0
  maximum: 1
  default: 1
- name: eye_right
  minimum: 0
  maximum: 1
  default: 1
- name: brow_left
  minimum: -1
  maximum: 1
  default: 0
- name: brow_right
  minimum: -1
  maximum: 1
  default: 0
- name: mouth_open
  minimum: 0
  maximum: 1
  default: 0.15
- name: breath
  minimum: -1
  maximum: 1
  default: 0
- name: mouth_width
  minimum: 0.5
  maximum: 1.6
  default: 1
- name: nose_size
  minimum: 0.5
  maximum: 1.6
  default: 1
- name: cheek_size
  minimum: 0.4
  maximum: 1.8
  default: 1.2
- name: cheek_opacity
  minimum: 0
  maximum: 1
  default: 1
# Shape and opacity controls compose with the original six facial channels.
# Scale only descendants; the named anchor remains fixed in the face.
face_transition_seconds: 0.18
face_transforms:
- {anchor: mouth, channel: mouth_width, axes: [x]}
- {anchor: nose, channel: nose_size, axes: [x, y]}
- {anchor: cheek.left, channel: cheek_size, axes: [x, y]}
- {anchor: cheek.right, channel: cheek_size, axes: [x, y]}
path_opacity:
  cheek.left: cheek_opacity
  cheek.right: cheek_opacity
expression_presets:
  embarrassed: [0.65, 0.65, 0.3, 0.3, 0.12, 0, 0.8, 1, 1.5, 0.85]
# Shape controls affect only the outline anchors and their child handles.
# Speed is cycles/second; phase is integrated, never recomputed from elapsed * speed.
contour:
  transition_seconds: 0.35
  controls:
  - {name: fullness, label: Fullness, minimum: -1, maximum: 1, default: 0}
  - {name: amplitude, label: Wave amplitude, minimum: 0, maximum: 1, default: 0.35}
  - {name: speed, label: Wave speed (cycles/s), minimum: 0, maximum: 2, default: 0.2}
  - {name: phase_spread, label: Phase spread, minimum: 0, maximum: 1, default: 1}
  # Unit directions follow the authored perimeter. Small feet get smaller excursions.
  # Fullness and wave are maximum normalized distances, not sensor measurements.
  lobes:
  - {point: lobe.left, direction: [-1, 0], fullness: 0.025, wave: 0.025, phase_turns: 0.0}
  - {point: lobe.upper_left, direction: [-0.6, -0.8], fullness: 0.035, wave: 0.045, phase_turns: 0.091}
  - {point: lobe.crown, direction: [0, -1], fullness: 0.05, wave: 0.06, phase_turns: 0.182}
  - {point: lobe.upper_right, direction: [0.6, -0.8], fullness: 0.035, wave: 0.04, phase_turns: 0.273}
  - {point: lobe.shoulder, direction: [0.8, -0.6], fullness: 0.035, wave: 0.035, phase_turns: 0.364}
  - {point: lobe.right, direction: [1, 0], fullness: 0.025, wave: 0.025, phase_turns: 0.455}
  - {point: lobe.lower_right, direction: [0.6, 0.8], fullness: 0.02, wave: 0.02, phase_turns: 0.545}
  - {point: lobe.foot_right, direction: [0, 1], fullness: 0.014, wave: 0.014, phase_turns: 0.636}
  - {point: lobe.belly, direction: [0, 1], fullness: 0.018, wave: 0.018, phase_turns: 0.727}
  - {point: lobe.foot_left, direction: [0, 1], fullness: 0.012, wave: 0.012, phase_turns: 0.818}
  - {point: lobe.lower_left, direction: [-0.6, 0.8], fullness: 0.014, wave: 0.014, phase_turns: 0.909}
