dependencies:
  espressif/esp-dl:
    version: "3.3.13"
    rules:
      - if: "$CONFIG{LUNASHELL_ACTIVITY_MODEL} == True"
  espressif/esp-sr:
    version: "2.4.6"
    rules:
      - if: "$CONFIG{LUNASHELL_BUILD_ENABLE_WAKE_WORD} == True"
  espressif/network_provisioning:
    version: "1.2.4"
    rules:
      - if: "$CONFIG{LUNASHELL_BUILD_ENABLE_PROVISIONING} == True"
  waveshare/qmi8658:
    version: "2.0.0"
    rules:
      - if: "$CONFIG{LUNASHELL_BUILD_ENABLE_IMU} == True && $CONFIG{LUNASHELL_BUILD_IMU_DRIVER_QMI8658} == True"
  cube32esp/xpowerslib:
    version: "0.3.3"
    rules:
      - if: "$CONFIG{LUNASHELL_BUILD_ENABLE_POWER_INPUTS} == True && $CONFIG{LUNASHELL_BUILD_PMU_DRIVER_AXP2101} == True"
