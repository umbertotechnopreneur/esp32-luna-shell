version: 3.0.1
description: Board Support Package (BSP) for Waveshare ESP32-S3-Touch-AMOLED-1.75
url: https://www.waveshare.com/esp32-s3-touch-amoled-1.75.htm

targets:
- esp32s3

tags:
- bsp

dependencies:
  espressif/usb:
    version: "1.5.0"
    public: true
  idf: ">=6.0,<6.1"
  lvgl/lvgl:
    version: "9.5.0"
    rules:
      - if: "$CONFIG{LUNASHELL_BUILD_ENABLE_UI} == True"
  espressif/esp_lcd_co5300:
    version: "2.1.0"
    rules:
      - if: "$CONFIG{LUNASHELL_BUILD_ENABLE_DISPLAY} == True"
  waveshare/esp_lcd_touch_cst9217:
    version: "2.0.0"
    rules:
      - if: "$CONFIG{LUNASHELL_BUILD_ENABLE_TOUCH} == True"
  espressif/esp_lvgl_adapter:
    version: "0.6.2"
    public: true
    rules:
      - if: "$CONFIG{LUNASHELL_BUILD_ENABLE_UI} == True"

  espressif/esp_codec_dev:
    version: "1.5.11"
    public: true
    rules:
      - if: "$CONFIG{LUNASHELL_BUILD_ENABLE_AUDIO} == True"

  espressif/esp_lcd_panel_io_additions:
    version: "1.0.1~1"
    rules:
      - if: "$CONFIG{LUNASHELL_BUILD_ENABLE_DISPLAY} == True"
  espressif/esp_io_expander_tca9554:
    version: "2.0.3"
    public: true
