# Build-time settings for the hardware Alpha; no fabricated firmware observations.
schema: cody.runtime.v1
demo:
  autostart: true
  steps:
    - {id: breathe, duration_seconds: 5, face: ready, amplitude: 0.12, speed: 0.25}
    - {id: contour_slow, duration_seconds: 7, face: ready, amplitude: 0.65, speed: 0.15}
    - {id: contour_fast, duration_seconds: 7, face: ready, amplitude: 0.65, speed: 1.4}
    - {id: sleepy, duration_seconds: 5, face: waking, amplitude: 0.15, speed: 0.2}
    - {id: awake, duration_seconds: 5, face: ready, amplitude: 0.3, speed: 0.5}
benchmark:
  # Debug-only fixed route for comparable native raster captures; it never feeds a firmware snapshot.
  enabled: false
  profile_blocks: false
  # Benchmark-only selection; ordinary S3 rendering uses SIMD independently.
  # scalar = baseline, simd_verify = exact comparison, simd = performance run.
  kernel: scalar
  cloud_scale_percent: 100
diagnostics:
  execution_timings: true
  mirror_to_sd_when_available: true
  report_interval_ms: 2000
  frame_budget_us: 40000
audio:
  # Match the one shared ES8311/ES7210 I2S clock, including active diagnostics.
  sample_rate_hz: 22050
  ready_duration_seconds: 0.18
  # Explicit authored selection; generation fails if its committed PCM is stale.
  # BootRise is 1.8 seconds. Earlier greeting auditions remain separate assets.
  eyes_open_cue: boot-rise
  ready_volume_percent: 100
  eyes_open_volume_percent: 100
